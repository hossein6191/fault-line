<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fault Line</title>
  <rect width="512" height="512" fill="#161616"/>
  <!-- the crystal, cut in two along the fault and slipped apart -->
  <g transform="translate(-14,-12)">
    <polygon points="256,84 352,190 345,246 172,312 160,190" fill="#825A6D"/>
    <polygon points="256,84 160,190 240,218" fill="#A17A8F"/>
    <polygon points="160,190 240,218 228,290 172,312" fill="#6A475A"/>
  </g>
  <g transform="translate(14,14)">
    <polygon points="172,312 345,246 325,428 192,428" fill="#523542"/>
    <polygon points="172,312 228,290 214,428 192,428" fill="#6A475A"/>
  </g>
  <!-- the blade -->
  <polygon points="92,352 96,340 430,206 422,224" fill="#F3E7EC" fill-opacity="0.22"/>
  <polygon points="96,346 426,212 424,218" fill="#FCFCFC"/>
</svg>
